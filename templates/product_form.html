{% extends "base.html" %}
{% block title %}{{ 'Редагування' if product_id else 'Новий товар' }} | TechNova{% endblock %}

{% block content %}
<section class="card auth-card wide">
    <h1>{{ 'Редагування товару №' ~ product_id if product_id else 'Додавання товару' }}</h1>
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-field">
            <label for="name">Назва товару</label>
            <input id="name" name="name" maxlength="150" value="{{ product.name }}" required>
        </div>

        <div class="form-field">
            <label for="category">Категорія</label>
            <select id="category" name="category" required>
                <option value="">Оберіть категорію</option>
                {% for c in categories %}
                <option value="{{ c.name }}" {% if product.category == c.name %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-field">
            <label for="price">Ціна (грн)</label>
            <input id="price" name="price" type="number" min="0" max="100000000" step="0.01"
                   value="{{ product.price }}" required>
        </div>

        <div class="form-field">
            <label for="description">Опис і характеристики</label>
            <textarea id="description" name="description" rows="5" maxlength="2000">{{ product.description }}</textarea>
        </div>

        <div class="form-field">
            <label for="image">Шлях до зображення (всередині static/)</label>
            <input id="image" name="image" placeholder="images/smartphones/iphone.jpg" value="{{ product.image }}">
        </div>

        <button class="btn btn-block" type="submit">{{ 'Зберегти зміни' if product_id else 'Додати товар' }}</button>
        <a class="btn btn-secondary btn-block" href="{{ url_for('admin_panel') }}">Скасувати</a>
    </form>
</section>
{% endblock %}
